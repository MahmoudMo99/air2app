<canvas
  #demoCanvas
  aria-label="Interactive demo canvas. Choose Move, Scale, or Rotate below, then click or touch and drag a shape."
  (pointerdown)="onPointerDown($event)"
  (pointermove)="onPointerMove($event)"
  (pointerup)="onPointerEnd($event)"
  (pointercancel)="onPointerEnd($event)"
  (lostpointercapture)="onPointerEnd($event)"
>
  Interactive canvas preview.
</canvas>

<div class="demo-hud demo-hud-top" aria-hidden="true">
  <div class="demo-identity">
    <span class="demo-identity-icon">
      <svg
        viewBox="0 0 24 24"
        fill="none"
        stroke="currentColor"
        stroke-width="1.7"
        stroke-linecap="round"
        stroke-linejoin="round"
      >
        <path d="M4 17C8 17 8 7 13 7S18 17 20 10" />
        <circle cx="20" cy="10" r="2" fill="currentColor" stroke="none" />
      </svg>
    </span>

    <span class="demo-identity-copy">
      <strong>INTERACTIVE PLAYGROUND</strong>
      <small>EXPLORE / CREATE / TRANSFORM</small>
    </span>

    <span class="demo-identity-dot"></span>
  </div>

  <div class="demo-camera-badge">
    <svg
      viewBox="0 0 24 24"
      fill="none"
      stroke="currentColor"
      stroke-width="1.7"
      stroke-linecap="round"
      stroke-linejoin="round"
    >
      <path d="M10 5h7a3 3 0 0 1 3 3v9a3 3 0 0 1-3 3H7a3 3 0 0 1-3-3V8" />
      <path d="m9 5 1-2h4l1 2" />
      <path d="M3 3l18 18" />
    </svg>

    <span>NO CAMERA REQUIRED</span>
  </div>
</div>

<div class="demo-hud demo-hud-bottom" aria-hidden="true">
  <div class="demo-prompt">
    <span class="demo-prompt-icon">
      <svg
        viewBox="0 0 24 24"
        fill="none"
        stroke="currentColor"
        stroke-width="1.8"
        stroke-linecap="round"
        stroke-linejoin="round"
      >
        <path d="M5 3v16l4.5-4.5 3.2 6.5 3.1-1.5-3.2-6.3H19L5 3Z" />
      </svg>
    </span>

    <span class="demo-prompt-copy">
      <strong>Pick a shape. Make it move.</strong>
      <small>Choose a tool below, then drag a shape.</small>
    </span>
  </div>

  <div class="demo-sequence">
    <span class="demo-sequence-item">
      <span>01</span>
      SELECT
    </span>

    <span class="demo-sequence-divider"></span>

    <span class="demo-sequence-item">
      <span>02</span>
      DRAG
    </span>

    <span class="demo-sequence-divider"></span>

    <span class="demo-sequence-item">
      <span>03</span>
      TRANSFORM
    </span>
  </div>
</div>
